name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # krävs för att skapa releasen

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Hämta version från taggen
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Publicera
        run: |
          dotnet publish -c Release -r linux-x64 --self-contained \
            -p:PublishSingleFile=true -p:Version=$VERSION -o out/linux
          dotnet publish -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:Version=$VERSION -o out/win

      - name: Skapa release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            out/linux/* out/win/*.exe \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
